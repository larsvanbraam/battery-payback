<!doctype html>
<!-- Source of public/og-image.png (1200×630), the noon chapter of the start screen as a share card.
     Rebuild: see scripts/og/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&display=swap">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative; box-sizing: border-box;
    padding: 64px 72px; background: #bcd2df; color: #121a26;
    font-family: "Chivo", system-ui, sans-serif; display: flex; flex-direction: column;
  }
  .sun { position: absolute; width: 760px; height: 760px; border-radius: 50%; background: #f2b705; left: 800px; top: -60px; }
  .brand { position: relative; display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 26px; text-transform: uppercase; letter-spacing: -0.03em; }
  .brand svg { width: 38px; height: 38px; fill: none; stroke: #121a26; stroke-width: 1.6; }
  .brand .fill { fill: #f2b705; stroke: none; }
  .brand .tip { fill: #121a26; stroke: none; }
  h1 { position: relative; margin: auto 0 0; font-size: 104px; line-height: .95; font-weight: 900; text-transform: uppercase; letter-spacing: -0.045em; }
  p { position: relative; margin: 28px 0 0; font-size: 30px; line-height: 1.3; max-width: 26ch; }
  .cta { position: relative; display: inline-block; align-self: flex-start; margin-top: 22px; padding: 13px 18px; background: #121a26; color: #fff; font-size: 23px; line-height: 1.2; font-weight: 700; }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="brand">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="17" height="12" rx="2"/><rect class="tip" x="20" y="10" width="2" height="4" rx="1"/><rect class="fill" x="4" y="8" width="8" height="8" rx="1"/></svg>
    Battery payback
  </div>
  <h1>Does a home<br>battery pay?</h1>
  <p>See whether a home battery could pay for itself after Dutch net metering ends in 2027. Compare estimated costs using your own hourly meter data.</p>
  <div class="cta">Compare batteries for free →</div>
</body>
</html>
